version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: palco_digital_db
    environment:
      POSTGRES_DB: palcodigital
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: