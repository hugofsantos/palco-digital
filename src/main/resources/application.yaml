spring:                                                                                                                                              
  application:                                                                                                                                       
    name: palco-digital                                                                                                                              
                                                                                                                                                     
  datasource:                                                                                                                                        
    url: jdbc:postgresql://localhost:5432/palcodigital                                                                                               
    username: dev_user                                                                                                                               
    password: dev_password                                                                                                                           
    driver-class-name: org.postgresql.Driver                                                                                                         
                                                                                                                                                     
  jpa:              
    open-in-view: false # Se ativado, o JPA mantém a sessão aberta durante toda a request                                                                                                                
    hibernate:
      ddl-auto: validate                                                                                                                             
    show-sql: true                                                                                                                                   
    properties:                                                                                                                                      
      hibernate:                                                                                                                                     
        format_sql: true                                                                                                                             
        highlight_sql: true                                                                                                                          
                                                                                                                                                     
  flyway:                                                                                                                                            
    enabled: true                                                                                                                                    
    baseline-on-migrate: true    
